name: Android build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
      - run: flutter pub get
      - run: ./tool/verify_android_build.sh
